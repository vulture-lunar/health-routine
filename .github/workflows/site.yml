name: Update videos and deploy site

on:
  push:
    branches: [main]
  schedule:
    # UTC 15:00 = next day 00:00 Asia/Seoul.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-routine-publish
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify updater
        run: python -m unittest discover -s tests -v
      - name: Refresh public video metadata
        run: python scripts/update_shorts.py
      - name: Save refreshed list
        run: |
          if ! git diff --quiet -- shorts-data.js index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add shorts-data.js index.html
            git commit -m 'Refresh daily YouTube Shorts metadata'
            git push origin HEAD:main
          fi

  build:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html *.css *.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
